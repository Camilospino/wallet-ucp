name: WalletUCP CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: walletucp
          POSTGRES_PASSWORD: walletucp_password
          POSTGRES_DB: walletucp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: Apply database migrations
      env:
        PGPASSWORD: walletucp_password
      run: |
        psql -h localhost -U walletucp -d walletucp_test -v ON_ERROR_STOP=1 \
          -f database/migrations/01-create_tables.sql

    - name: Run backend linter
      run: |
        cd backend
        npm run lint

    - name: Run backend tests
      run: |
        cd backend
        npm test
      env:
        DATABASE_URL: postgresql://walletucp:walletucp_password@localhost:5432/walletucp_test
        JWT_SECRET: test-secret-key
        JWT_EXPIRES_IN: 1h
        BCRYPT_ROUNDS: 4
        NODE_ENV: test
        TEST_DATABASE_URL: postgresql://walletucp:walletucp_password@localhost:5432/walletucp_test

    - name: Setup Node.js for frontend
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend linter
      run: |
        cd frontend
        npm run lint

    - name: Run frontend tests
      run: |
        cd frontend
        npm test

    - name: Build frontend
      run: |
        cd frontend
        npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      run: |
        docker build -t walletucp-backend:${{ github.sha }} ./backend

    - name: Build frontend image
      run: |
        docker build -t walletucp-frontend:${{ github.sha }} ./frontend

    - name: Run Docker Compose build
      run: |
        docker compose build

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Audit production dependencies (blocking)
      # Only what actually ships to production must be clean. `npm audit`
      # exits 1 when it finds anything, so dev-only tooling is checked
      # separately below and never blocks the pipeline on its own.
      run: |
        cd backend
        npm audit --omit=dev --audit-level=moderate
        cd ../frontend
        npm audit --omit=dev --audit-level=moderate

    - name: Audit development dependencies (informational)
      # Vite/Vitest/esbuild are devDependencies and are never deployed.
      # Reported for visibility, but they must not fail the build.
      continue-on-error: true
      run: |
        cd backend
        npm audit --audit-level=high
        cd ../frontend
        npm audit --audit-level=high

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

  # Smoke test: builds the compose stack and asserts the API answers. This is
  # a real check, not a placeholder, so the job is worth running.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start the stack
      run: docker compose up -d --wait

    - name: Show logs on failure
      if: failure()
      run: docker compose logs --no-color

    - name: Verify the API is healthy
      run: |
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:5000/health; then
            echo ""
            echo "API healthy"
            exit 0
          fi
          sleep 2
        done
        echo "The API never became healthy" >&2
        exit 1

    - name: Verify the frontend serves the app
      run: |
        curl -fsS http://localhost:3000/ | grep -q 'WalletUCP' \
          && echo "Frontend OK"

    - name: Verify a login round-trip
      run: |
        response=$(curl -fsS -X POST http://localhost:5000/api/auth/login \
          -H 'Content-Type: application/json' \
          -d '{"email":"admin@example.com","password":"Admin123!"}')
        echo "$response" | grep -q '"success":true' \
          && echo "Login OK"

    - name: Tear down
      if: always()
      run: docker compose down -v
