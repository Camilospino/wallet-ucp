# Sitio por defecto del puerto 80 (host 8080): cualquier peticion cuyo Host no
# sea wallet-ucp.local ni wallet-ucp-qa.local. Es la practica anterior del
# curso que ya servia el NGINX nativo del laboratorio; se conserva igual.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/practica-wsl-ucp/dist;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
