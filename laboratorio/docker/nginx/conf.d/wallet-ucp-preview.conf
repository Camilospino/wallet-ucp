# ===========================================================================
# ACCESO TEMPORAL POR PUERTOS (solo para revision local)
#
# El laboratorio exige entrar por hosts distintos (wallet-ucp.local y
# wallet-ucp-qa.local). Editar /etc/hosts requiere sudo, asi que este bloque
# ofrece un atajo para revisar la aplicacion de inmediato:
#
#   http://localhost:8083  ->  equivalente a wallet-ucp-qa.local:8080
#   (en el Mac; dentro del laboratorio este server escucha en 8081)
#   http://localhost:8082  ->  equivalente a wallet-ucp.local:8080
#
# Se puede BORRAR sin riesgo cuando ya configures /etc/hosts:
#     rm /etc/nginx/sites-enabled/wallet-ucp-preview
#     nginx -s reload
# No altera los ambientes del laboratorio, que siguen sirviendo por su host.
# ===========================================================================

server {
    # QA en el puerto 8081
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /var/www/html/wallet-ucp-qa;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Backend de QA (puerto 5001 -> BD walletucp_qa)
    location /api/ {
        proxy_pass http://backend-qa:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api-docs {
        proxy_pass http://backend-qa:5001;
        proxy_set_header Host $host;
    }

    # Sonda de salud del backend de QA (mismo fix que en el vhost de QA).
    location = /health {
        proxy_pass http://backend-qa:5001;
        proxy_set_header Host $host;
        access_log off;
    }

    autoindex off;
}

server {
    # Produccion en el puerto 8082
    listen 8082;
    listen [::]:8082;
    server_name _;

    root /var/www/html/wallet-ucp-produccion;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Backend de produccion (puerto 5000 -> BD walletucp)
    location /api/ {
        proxy_pass http://backend-prod:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api-docs {
        proxy_pass http://backend-prod:5000;
        proxy_set_header Host $host;
    }

    # Sonda de salud del backend de produccion (mismo fix que en su vhost).
    location = /health {
        proxy_pass http://backend-prod:5000;
        proxy_set_header Host $host;
        access_log off;
    }

    autoindex off;
}
