# Ambiente Produccion de WalletUCP
#
# Se despliega desde la rama `main` de GitHub, unicamente tras el Merge Request.
# Es un servidor INDEPENDIENTE del de QA: distinto root, distinto server_name,
# logs separados y su propio registro en el archivo hosts de Windows.
#
#   Directorio : /var/www/html/wallet-ucp-produccion
#   Host       : wallet-ucp.local  ->  127.0.0.1 wallet-ucp.local

server {
    listen 80;
    listen [::]:80;

    server_name wallet-ucp.local;

    access_log /var/log/nginx/wallet-ucp-produccion.access.log;
    error_log  /var/log/nginx/wallet-ucp-produccion.error.log;

    root /var/www/html/wallet-ucp-produccion;
    index index.html;

    # SPA con React Router: toda ruta que no sea un archivo real se resuelve en
    # el cliente desde index.html. Sin esto, /dashboard daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API contra el backend Express de PRODUCCION (puerto 5000), que se conecta
    # a la base de datos `walletucp`. Este backend es una instancia distinta del
    # de QA y usa OTRA base de datos: lo que se haga aqui no afecta el ambiente QA.
    location /api/ {
        proxy_pass http://backend-prod:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api-docs {
        proxy_pass http://backend-prod:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sonda de salud del backend. Sin este bloque, /health caia en el
    # `location /` de la SPA y devolvia el index.html de React con HTTP 200:
    # un health check que solo mira el codigo de respuesta daba falso positivo.
    location = /health {
        proxy_pass http://backend-prod:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    autoindex off;
}
