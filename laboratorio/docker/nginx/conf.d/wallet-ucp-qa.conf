# Ambiente QA / Desarrollo de WalletUCP
#
# Se despliega desde la rama `develop` de GitHub. Es un servidor INDEPENDIENTE
# del de produccion: distinto root, distinto server_name y su propio registro
# en el archivo hosts de Windows.
#
#   Directorio : /var/www/html/wallet-ucp-qa
#   Host       : wallet-ucp-qa.local  ->  127.0.0.1 wallet-ucp-qa.local

server {
    listen 80;
    listen [::]:80;

    server_name wallet-ucp-qa.local;

    # Registro en la raiz del dominio, para no ensuciar los logs con el 404
    # de favicon.ico.
    access_log /var/log/nginx/wallet-ucp-qa.access.log;
    error_log  /var/log/nginx/wallet-ucp-qa.error.log;

    root /var/www/html/wallet-ucp-qa;
    index index.html;

    # La aplicacion es una SPA con React Router (11 rutas: /login, /dashboard,
    # /deposit, /withdraw, /transfer, /transactions, /profile, /admin...).
    # Sin try_files, entrar directo a /dashboard daria 404 porque no existe un
    # archivo con ese nombre en disco: se le entrega index.html y el router
    # resuelve la ruta en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El bundle es Vite: los assets tienen hash en el nombre, asi que se pueden
    # cachear de forma agresiva sin riesgo de servir versiones viejas.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy inverso hacia el backend Express de QA (puerto 5001), que a su vez
    # se conecta a la base de datos walletucp_qa. El enunciado exige que la app
    # se comunique de verdad con la base de datos, y eso solo ocurre si el
    # frontend alcanza la API. QA y produccion usan instancias y bases DISTINTAS.
    location /api/ {
        proxy_pass http://backend-qa:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Documentacion interactiva de la API (Swagger UI) del backend de QA.
    location /api-docs {
        proxy_pass http://backend-qa:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sonda de salud del backend. Sin este bloque, /health caia en el
    # `location /` de la SPA y devolvia el index.html de React con HTTP 200:
    # un health check que solo mira el codigo de respuesta daba falso positivo.
    location = /health {
        proxy_pass http://backend-qa:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # No se listan los archivos del directorio.
    autoindex off;
}
